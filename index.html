<title>NSE Signal Desk</title>
<meta name="description" content="Nifty 500 / F&O screening, sector rankings and research desk — manual-refresh, source-audited market data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#eeece4; --border:#dcd8cc;
  --text:#1b2420; --text-dim:#5b655d; --text-faint:#8a9089;
  --accent:#a5761f; --accent-weak:#f1e3c8;
  --pos:#1f8f6e; --pos-weak:#e2f3ec; --neg:#bb4426; --neg-weak:#fbe8e1; --warn:#a5761f; --warn-weak:#f1e3c8;
  --shadow: 0 1px 2px rgba(30,25,10,.06), 0 4px 16px rgba(30,25,10,.05);
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12100a; --surface:#1b1913; --surface-2:#241f16; --border:#332c1e;
    --text:#f1ede1; --text-dim:#b9b39f; --text-faint:#847d68;
    --accent:#e0b24d; --accent-weak:#3a2f16;
    --pos:#4fcda0; --pos-weak:#173327; --neg:#f0785a; --neg-weak:#3a1c14; --warn:#e0b24d; --warn-weak:#3a2f16;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12100a; --surface:#1b1913; --surface-2:#241f16; --border:#332c1e;
  --text:#f1ede1; --text-dim:#b9b39f; --text-faint:#847d68;
  --accent:#e0b24d; --accent-weak:#3a2f16;
  --pos:#4fcda0; --pos-weak:#173327; --neg:#f0785a; --neg-weak:#3a1c14; --warn:#e0b24d; --warn-weak:#3a2f16;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 20px rgba(0,0,0,.35);
  color-scheme: dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"IBM Plex Sans",sans-serif;font-weight:600;margin:0 0 .35em;text-wrap:balance}
a{color:var(--accent)}
button{font-family:inherit;font-size:13px;cursor:pointer}
::-webkit-scrollbar{height:9px;width:9px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}

/* ---------- layout ---------- */
#app{display:flex;min-height:100%}
.sidebar{
  width:216px;flex:0 0 auto;border-right:1px solid var(--border);
  padding:16px 10px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;
  background:var(--surface);
}
.brand{display:flex;align-items:center;gap:8px;padding:4px 8px 16px}
.brand-mark{width:22px;height:22px;border-radius:6px;background:var(--accent);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono";font-weight:600;font-size:12px;color:var(--surface)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--text-faint);margin-top:-2px}
nav.tabs{display:flex;flex-direction:column;gap:2px}
nav.tabs button{
  text-align:left;padding:8px 10px;border:0;background:transparent;color:var(--text-dim);
  border-radius:8px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:6px;
}
nav.tabs button:hover{background:var(--surface-2);color:var(--text)}
nav.tabs button.active{background:var(--accent-weak);color:var(--accent)}
nav.tabs .badge{font-family:"IBM Plex Mono";font-size:10px;background:var(--surface-2);color:var(--text-faint);padding:1px 6px;border-radius:20px}
nav.tabs button.active .badge{background:var(--surface);color:var(--accent)}
.sidebar-foot{margin-top:16px;padding:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-faint)}

.main{flex:1 1 auto;min-width:0;padding:18px 26px 60px}
.topbar{
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;
  padding-bottom:14px;margin-bottom:18px;border-bottom:1px solid var(--border);
}
.status-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--text-dim)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;border:1px solid var(--border)}
.pill.open{color:var(--pos);background:var(--pos-weak);border-color:transparent}
.pill.closed{color:var(--text-faint);background:var(--surface-2);border-color:transparent}
.pill.pre{color:var(--warn);background:var(--warn-weak);border-color:transparent}
.pill.stale{color:var(--neg);background:var(--neg-weak);border-color:transparent}
.btn{padding:7px 13px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center}

.view{display:none}
.view.active{display:block}

/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.grid{display:grid;gap:14px}
.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-2{grid-template-columns:repeat(2,1fr)}
@media (max-width:900px){.grid-4{grid-template-columns:repeat(2,1fr)}.grid-3{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:600}
.stat-value{font-family:"IBM Plex Mono";font-size:26px;font-weight:600;margin-top:4px}
.stat-sub{font-size:11.5px;color:var(--text-dim);margin-top:2px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.section-title h2{font-size:16px}
.section-title .hint{font-size:12px;color:var(--text-faint)}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12.5px}
thead th{
  position:sticky;top:0;background:var(--surface-2);text-align:left;padding:8px 10px;font-weight:600;
  font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);white-space:nowrap;cursor:pointer;
  border-bottom:1px solid var(--border);
}
thead th:hover{color:var(--accent)}
thead th.num,td.num{text-align:right}
table[data-no-sort] thead th{cursor:default}
table[data-no-sort] thead th:hover{color:var(--text-dim)}
thead th[data-dir="asc"]::after{content:" \25b2";font-size:9px;vertical-align:middle}
thead th[data-dir="desc"]::after{content:" \25bc";font-size:9px;vertical-align:middle}
tbody td{padding:7px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums}
tbody td.txt{font-family:"IBM Plex Sans"}
tbody tr:hover{background:var(--surface-2)}
tbody tr{cursor:pointer}
.tag{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.02em}
.tag.pv{background:var(--warn-weak);color:var(--warn)}
.tag.rsi{background:var(--pos-weak);color:var(--pos)}
.tag.both{background:var(--accent);color:var(--surface)}
.tag.none{background:var(--surface-2);color:var(--text-faint);border:1px solid var(--border)}
.tag.pos{background:var(--pos-weak);color:var(--pos)}
.tag.neg{background:var(--neg-weak);color:var(--neg)}
.up{color:var(--pos)} .down{color:var(--neg)}
.na{color:var(--text-faint);font-style:italic}

/* ---------- toolbar (search/filter/export) ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input[type=text]{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px;min-width:180px}
.toolbar select{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12.5px}
.toolbar .spacer{flex:1}
.count-note{font-size:11.5px;color:var(--text-faint)}

/* ---------- sector accordion ---------- */
.chev{display:inline-block;width:1em;color:var(--text-faint);transition:transform .2s ease}
.sector-expand-row td{background:var(--surface-2)}
.sector-expand-inner{max-height:0;overflow:hidden;transition:max-height 300ms ease, padding 300ms ease;padding:0 16px}
.sector-expand-inner.open{padding:14px 16px}

/* ---------- heatmap ---------- */
.heatgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.heattile{border-radius:9px;padding:10px 12px;border:1px solid var(--border);min-height:78px;display:flex;flex-direction:column;justify-content:space-between}
.heattile .hname{font-size:12px;font-weight:600}
.heattile .hscore{font-family:"IBM Plex Mono";font-size:20px;font-weight:700}
.heattile .hsub{font-size:10.5px;opacity:.85}

/* ---------- banners ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;border:1px solid var(--border);font-size:12.5px;margin-bottom:14px}
.banner.warn{background:var(--warn-weak);border-color:transparent;color:var(--warn)}
.banner.info{background:var(--surface-2);color:var(--text-dim)}

/* ---------- detail / methodology prose ---------- */
.prose{max-width:760px;font-size:13.5px;color:var(--text-dim)}
.prose h3{color:var(--text);font-size:14px;margin-top:22px}
.prose table{font-size:12.5px;margin:10px 0}
.prose td,.prose th{padding:6px 10px;border:1px solid var(--border);font-family:"IBM Plex Mono"}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv dt{color:var(--text-faint)}
.kv dd{margin:0;font-family:"IBM Plex Mono"}

/* ---------- modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(10,8,2,.45);display:none;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:760px;width:100%;padding:22px;box-shadow:var(--shadow);margin-bottom:5vh}
.modal-close{float:right}

.tabstrip-mobile{display:none}
@media (max-width:860px){
  .sidebar{display:none}
  .tabstrip-mobile{
    display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5;
  }
  .tabstrip-mobile button{white-space:nowrap;padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-weight:600;font-size:12.5px}
  .tabstrip-mobile button.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
  .main{padding:12px 14px 40px}
}
</style>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">N5</div>
      <div>
        <div class="brand-name">NSE Signal Desk</div>
        <div class="brand-sub">Nifty 500 + F&amp;O research</div>
      </div>
    </div>
    <nav class="tabs" id="nav-tabs"></nav>
    <div class="sidebar-foot" id="sidebar-foot">Loading data…</div>
  </aside>

  <main class="main">
    <div class="tabstrip-mobile" id="nav-tabs-mobile"></div>

    <div class="topbar">
      <div class="status-row" id="status-row">Loading market status…</div>
      <div class="status-row">
        <button class="btn" id="theme-toggle" title="Toggle theme">Theme</button>
        <button class="btn primary" id="refresh-btn">Refresh now</button>
      </div>
    </div>

    <div id="views"></div>
  </main>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal-content"></div>
</div>

<script>
window.__DATA__ = { snapshot: null, status: null, news: null, error: null };
</script>
<script src="app.js"></script>
